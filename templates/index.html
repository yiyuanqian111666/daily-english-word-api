<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG 英语冒险 - 多邻国式三阶段进阶与挑战系统 (v10.0)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rpgdark: '#0f172a',
                        rpgcard: '#1e293b',
                        rpgaccent: '#8b5cf6',
                        rpggold: '#f59e0b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-rpgdark text-slate-100 min-h-screen font-sans selection:bg-rpgaccent selection:text-white">

    <!-- 顶导航栏 -->
    <header class="bg-rpgcard/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-rpgaccent/20 p-2.5 rounded-xl border border-rpgaccent/40 text-rpgaccent text-xl">
                    <i class="fa-solid fa-map-marked-alt"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white tracking-wide">RPG 英语世界</h1>
                    <p class="text-xs text-slate-400">多邻国三阶段渐进式版 v10.0</p>
                </div>
            </div>

            <!-- 用户 RPG 状态面板 -->
            <div class="flex items-center space-x-4 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-medal text-rpggold"></i>
                    <span id="user-title" class="text-sm font-semibold text-rpggold">初学冒险者</span>
                </div>
                <div class="h-4 w-[1px] bg-slate-600"></div>
                <div class="flex items-center space-x-1.5">
                    <i class="fa-solid fa-bolt text-amber-400"></i>
                    <span class="text-xs text-slate-400">XP:</span>
                    <span id="user-xp" class="font-bold text-amber-400">100</span>
                </div>
                <div class="h-4 w-[1px] bg-slate-600"></div>
                <button onclick="playClickSound(); openInventory();" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition border border-slate-600 flex items-center space-x-1">
                    <i class="fa-solid fa-backpack"></i><span>背包</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-4xl mx-auto px-4 py-8">

        <!-- 视图 1：难度选择大地图 -->
        <div id="view-map" class="space-y-6">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-extrabold text-white mb-2">选择你的学习难度与关卡</h2>
                <p class="text-sm text-slate-400">多邻国式阶梯学习：先学会认读 → 再进行拼写训练 → 最后挑战极限默写！</p>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <button onclick="selectDifficulty('easy')" id="btn-diff-easy" class="diff-btn bg-blue-900/30 border border-blue-500/60 hover:border-blue-400 p-4 rounded-xl text-center transition">
                    <div class="text-blue-400 font-bold text-base mb-1">🟢 简单</div>
                    <div class="text-xs text-slate-400">日常/基础词汇</div>
                </button>
                <button onclick="selectDifficulty('normal')" id="btn-diff-normal" class="diff-btn bg-emerald-900/30 border border-emerald-500/60 hover:border-emerald-400 p-4 rounded-xl text-center transition">
                    <div class="text-emerald-400 font-bold text-base mb-1">🔵 进阶</div>
                    <div class="text-xs text-slate-400">职场与短语</div>
                </button>
                <button onclick="selectDifficulty('hard')" id="btn-diff-hard" class="diff-btn bg-amber-900/30 border border-amber-500/60 hover:border-amber-400 p-4 rounded-xl text-center transition">
                    <div class="text-amber-400 font-bold text-base mb-1">🟠 困难</div>
                    <div class="text-xs text-slate-400">学术与俚语</div>
                </button>
                <button onclick="selectDifficulty('hell')" id="btn-diff-hell" class="diff-btn bg-rose-900/30 border border-rose-500/60 hover:border-rose-400 p-4 rounded-xl text-center transition">
                    <div class="text-rose-400 font-bold text-base mb-1">🔴 地狱</div>
                    <div class="text-xs text-slate-400">哲学与长难句</div>
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div onclick="startStageFlow()" class="bg-gradient-to-br from-purple-900/40 to-slate-900 border border-purple-500/40 hover:border-purple-400 rounded-2xl p-6 cursor-pointer transition transform hover:-translate-y-1 shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="w-12 h-12 bg-purple-500/20 text-purple-400 rounded-xl flex items-center justify-center text-xl mb-4 border border-purple-500/30">
                            <i class="fa-solid fa-stairs"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">🚀 开始三阶段渐进特训</h3>
                        <p class="text-xs text-slate-400 mb-4">执行多邻国标准流程：<br>1. 沉浸认读 → 2. 互动拼写 → 3. 极限默写挑战。</p>
                    </div>
                    <div class="flex justify-between items-center text-xs text-purple-400 font-semibold pt-4 border-t border-slate-800">
                        <span>当前选中难度: <span id="current-selected-diff" class="text-white uppercase">easy</span></span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>

                <div onclick="loadShopItems(); document.getElementById('shop-section').scrollIntoView({behavior: 'smooth'})" class="bg-gradient-to-br from-blue-900/40 to-slate-900 border border-blue-500/40 hover:border-blue-400 rounded-2xl p-6 cursor-pointer transition transform hover:-translate-y-1 shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="w-12 h-12 bg-blue-500/20 text-blue-400 rounded-xl flex items-center justify-center text-xl mb-4 border border-blue-500/30">
                            <i class="fa-solid fa-store"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">🛒 冒险补给商店</h3>
                        <p class="text-xs text-slate-400 mb-4">使用闯关获得的 XP 兑换专属高级称号、加成道具与复活金牌。</p>
                    </div>
                    <div class="flex justify-between items-center text-xs text-blue-400 font-semibold pt-4 border-t border-slate-800">
                        <span>前往商店</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 视图 2：三阶段互动游戏区 -->
        <div id="view-game" class="hidden bg-rpgcard border border-slate-700/80 rounded-2xl shadow-xl p-6 md:p-8 relative overflow-hidden mb-8">
            <div class="flex justify-between items-center mb-6 text-xs text-slate-400 border-b border-slate-700/50 pb-4">
                <div class="flex items-center space-x-2">
                    <button onclick="backToMap()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition border border-slate-600">
                        <i class="fa-solid fa-arrow-left mr-1"></i> 返回地图
                    </button>
                    <span id="game-stage-tag" class="bg-rpgaccent/20 text-rpgaccent px-2.5 py-1 rounded-md font-semibold">阶段一：认读</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span>🔥 连击: <strong id="streak-count" class="text-amber-400">0</strong></span>
                    <span id="timer-wrapper" class="hidden">⏱ 剩余时间: <strong id="exam-timer" class="text-rose-400">15.0s</strong></span>
                </div>
            </div>

            <div id="question-container" class="text-center mb-6"></div>
            <div id="feedback-box" class="hidden rounded-xl p-4 text-center text-sm font-medium transition animate-fade-in mb-4"></div>
            <div class="text-center" id="action-btn-container"></div>
        </div>

        <!-- 冒险商店区域 -->
        <div id="shop-section" class="bg-rpgcard border border-slate-700/80 rounded-2xl shadow-xl p-6 md:p-8 mt-12">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-store text-rpggold"></i>
                    <span>冒险补给商店</span>
                </h3>
                <button onclick="playClickSound(); loadShopItems();" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 刷新商品
                </button>
            </div>
            
            <div id="shop-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="text-center text-slate-500 py-6 col-span-3">正在加载商店商品...</div>
            </div>
        </div>

    </main>

    <!-- 背包模态框 -->
    <div id="inventory-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-rpgcard border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-backpack text-rpgaccent"></i>
                    <span>冒险者背包</span>
                </h3>
                <button onclick="closeInventory()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="inventory-list" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                <p class="text-center text-slate-500 py-6">背包空空如也，快去商店采购吧！</p>
            </div>
        </div>
    </div>

    <!-- 游戏逻辑脚本 -->
    <script>
        const API_BASE = "http://127.0.0.1:5000/api";
        let selectedDifficulty = "easy";
        let currentStage = 1;
        let currentWordData = null;
        let streak = 0;
        let timerInterval = null;
        let timeLeft = 15.0;

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playClickSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.05);
            } catch (e) {}
        }

        function playSuccessSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.3);
                });
            } catch (e) {}
        }

        function playFailSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now); osc.stop(now + 0.3);
            } catch (e) {}
        }

        function speakText(text) {
            playClickSound();
            if (!text) return;
            const audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=2`;
            const audio = new Audio(audioUrl);
            audio.play().catch(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    window.speechSynthesis.speak(utterance);
                }
            });
        }

        function selectDifficulty(diff) {
            playClickSound();
            selectedDifficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.remove('border-white', 'shadow-lg');
            });
            document.getElementById(`btn-diff-${diff}`).classList.add('border-white', 'shadow-lg');
            document.getElementById('current-selected-diff').innerText = diff;
        }

        function startStageFlow() {
            playClickSound();
            currentStage = 1; 
            streak = 0;
            document.getElementById('view-map').classList.add('hidden');
            document.getElementById('view-game').classList.remove('hidden');
            fetchNewWord();
        }

        function backToMap() {
            playClickSound();
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById('view-map').classList.remove('hidden');
        }

        async function fetchNewWord() {
            try {
                const res = await fetch(`${API_BASE}/learn?difficulty=${selectedDifficulty}`);
                const data = await res.json();
                currentWordData = data;
                currentStage = 1;
                
                if (data.user_status) {
                    updateUserProfile(data.user_status);
                }

                document.getElementById('feedback-box').classList.add('hidden');
                updateStageHeader();
                renderStageContent();
            } catch (err) {
                console.error("获取单词失败:", err);
            }
        }

        function updateStageHeader() {
            const stageTags = {
                1: "📖 阶段一：沉浸式认读",
                2: "✍️ 阶段二：互动拼写辅助",
                3: "⚡ 阶段三：极限默写挑战"
            };
            document.getElementById('game-stage-tag').innerText = stageTags[currentStage];
            document.getElementById('streak-count').innerText = streak;

            if (currentStage === 3 && currentWordData && currentWordData.challenge_config) {
                timeLeft = currentWordData.challenge_config.time_limit;
                document.getElementById('timer-wrapper').classList.remove('hidden');
                startChallengeTimer();
            } else {
                document.getElementById('timer-wrapper').classList.add('hidden');
            }
        }

        function startChallengeTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                document.getElementById('exam-timer').innerText = timeLeft.toFixed(1) + 's';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitChallengeResult(false, 0.0);
                }
            }, 100);
        }

        function renderStageContent() {
            const container = document.getElementById('question-container');
            const btnContainer = document.getElementById('action-btn-container');
            const data = currentWordData;

            if (currentStage === 1) {
                container.innerHTML = `
                    <div class="mb-4">
                        ${data.image_url ? `<img src="${data.image_url}" class="w-48 h-32 object-cover mx-auto rounded-xl mb-4 border border-slate-700 shadow-md">` : ''}
                        <h3 class="text-3xl font-extrabold text-white mb-2">${data.word}</h3>
                        <button onclick="speakText('${data.word.replace(/'/g, "\\'")}')" class="bg-rpgaccent/20 hover:bg-rpgaccent/40 active:scale-95 text-rpgaccent px-4 py-2 rounded-full border border-rpgaccent/40 text-xs transition mb-3">
                            <i class="fa-solid fa-volume-high mr-1.5"></i> 播放标准发音
                        </button>
                        <h4 class="text-xl font-bold text-rpggold mb-2">${data.meaning}</h4>
                        <p class="text-sm text-slate-300 italic max-w-md mx-auto mb-2">"${data.example}"</p>
                        ${data.grammar_note ? `<p class="text-xs text-blue-400 bg-blue-950/40 p-2 rounded-lg max-w-md mx-auto">💡 语法笔记: ${data.grammar_note}</p>` : ''}
                    </div>
                `;
                speakText(data.word);
                btnContainer.innerHTML = `
                    <button onclick="nextStage()" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded-xl font-semibold transition shadow-lg">
                        记住了，进入下一步 <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                `;
            } else if (currentStage === 2) {
                const targetWord = data.word;
                const letters = listChars(targetWord);
                const hint = `首字母大写提示: ${targetWord[0].toUpperCase()}... (共 ${targetWord.length} 个字符)`;

                container.innerHTML = `
                    <p class="text-xs text-slate-400 mb-2">中文释义：<strong class="text-white text-lg">${data.meaning}</strong></p>
                    <p class="text-xs text-amber-400 mb-4">${hint}</p>
                    <p class="text-xs text-slate-500 mb-4">打乱字母参考：<span class="tracking-widest text-rpgaccent font-mono bg-slate-900 px-3 py-1 rounded border border-slate-700">${letters.join(' ')}</span></p>
                    <div class="max-w-md mx-auto">
                        <input type="text" id="user-input" placeholder="输入正确的单词拼写..." autocomplete="off" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rpgaccent text-center font-medium">
                    </div>
                `;
                btnContainer.innerHTML = `
                    <button onclick="checkStage2()" class="w-full md:w-auto bg-rpgaccent hover:bg-rpgaccent/80 text-white px-8 py-3 rounded-xl font-semibold transition shadow-lg">
                        提交拼写
                    </button>
                `;
                setTimeout(() => {
                    const inputEl = document.getElementById('user-input');
                    if(inputEl) {
                        inputEl.focus();
                        inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkStage2(); });
                    }
                }, 100);
            } else if (currentStage === 3) {
                container.innerHTML = `
                    <p class="text-xs text-slate-400 mb-2">🔥 【极限盲打默写】根据中文释义直接默写英文：</p>
                    <h3 class="text-2xl font-bold text-rpggold mb-4">${data.meaning}</h3>
                    <p class="text-xs text-slate-500 italic mb-6">例句: "${data.example}"</p>
                    <div class="max-w-md mx-auto">
                        <input type="text" id="user-input" placeholder="盲打默写英文单词..." autocomplete="off" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500 text-center font-medium">
                    </div>
                `;
                btnContainer.innerHTML = `
                    <button onclick="checkStage3()" class="w-full md:w-auto bg-rose-600 hover:bg-rose-500 text-white px-8 py-3 rounded-xl font-semibold transition shadow-lg">
                        确认默写并提交
                    </button>
                `;
                setTimeout(() => {
                    const inputEl = document.getElementById('user-input');
                    if(inputEl) {
                        inputEl.focus();
                        inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkStage3(); });
                    }
                }, 100);
            }
        }

        function listChars(str) {
            const arr = str.replace(/ /g, '').split('');
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        async function nextStage() {
            playSuccessSound();
            try {
                const res = await fetch(`${API_BASE}/challenge/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        word_id: currentWordData.id,
                        stage: 1,
                        used_time: 1.0,
                        success: true, // 显式传递标准布尔值
                        difficulty: selectedDifficulty
                    })
                });
                const result = await res.json();
                if (res.ok && result.user_profile) {
                    updateUserProfile(result.user_profile);
                }
            } catch (e) {
                console.error("阶段一同步错误:", e);
            }

            currentStage = 2;
            updateStageHeader();
            renderStageContent();
        }

        async function checkStage2() {
            const inputEl = document.getElementById('user-input');
            const typed = inputEl ? inputEl.value.trim() : "";
            const target = currentWordData.word.trim();

            if (typed.toLowerCase() === target.toLowerCase()) {
                playSuccessSound();
                showFeedback(true, "✍️ 拼写辅助通过，获得拼写 XP 奖励！进入终极盲打默写！", 15);
                
                try {
                    const res = await fetch(`${API_BASE}/challenge/submit`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            word_id: currentWordData.id,
                            stage: 2,
                            used_time: 2.0,
                            success: true, // 显式传递标准布尔值
                            difficulty: selectedDifficulty
                        })
                    });
                    const result = await res.json();
                    if (res.ok && result.user_profile) {
                        updateUserProfile(result.user_profile);
                    }
                } catch (e) {
                    console.error("阶段二同步错误:", e);
                }

                currentStage = 3;
                setTimeout(() => {
                    updateStageHeader();
                    renderStageContent();
                }, 1200);
            } else {
                playFailSound();
                showFeedback(false, `拼写错误，正确答案是: ${currentWordData.word}`, 0);
            }
        }

        function checkStage3() {
            if (timerInterval) clearInterval(timerInterval);
            const usedTime = currentWordData.challenge_config.time_limit - timeLeft;
            const inputEl = document.getElementById('user-input');
            const typed = inputEl ? inputEl.value.trim() : "";
            const target = currentWordData.word.trim();
            const success = typed.toLowerCase() === target.toLowerCase();

            submitChallengeResult(success, usedTime);
        }

        async function submitChallengeResult(success, usedTime) {
            if (timerInterval) clearInterval(timerInterval);

            if (success) {
                streak++;
                playSuccessSound();
            } else {
                streak = 0;
                playFailSound();
            }

            try {
                const res = await fetch(`${API_BASE}/challenge/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        word_id: currentWordData.id,
                        stage: 3,
                        used_time: usedTime > 0 ? usedTime : 1.0,
                        success: Boolean(success), // 确保强转为布尔类型
                        difficulty: selectedDifficulty,
                        streak: streak
                    })
                });
                const result = await res.json();

                if (res.ok) {
                    showFeedback(result.success, result.interactive_comment, result.earned_xp);
                    if (result.user_profile) {
                        updateUserProfile(result.user_profile);
                    }

                    if (success) {
                        setTimeout(() => {
                            fetchNewWord(); 
                        }, 1600);
                    }
                }
            } catch (err) {
                console.error("提交异常:", err);
            }
        }

        function showFeedback(success, comment, earnedXp) {
            const box = document.getElementById('feedback-box');
            box.classList.remove('hidden');
            if (success) {
                box.className = "rounded-xl p-4 text-center text-sm font-medium bg-emerald-900/40 border border-emerald-500/50 text-emerald-300 animate-fade-in mb-4";
                box.innerHTML = `<p class="font-bold text-base mb-1">🎉 通过！</p><p>${comment}</p><p class="text-xs text-amber-400 mt-1">获得 XP 奖励: +${earnedXp}</p>`;
            } else {
                box.className = "rounded-xl p-4 text-center text-sm font-medium bg-rose-900/40 border border-rose-500/50 text-rose-300 animate-fade-in mb-4";
                box.innerHTML = `<p class="font-bold text-base mb-1">❌ 未通过</p><p>${comment}</p><p class="text-xs text-slate-400 mt-1">正确答案是：<span class="text-white font-bold">${currentWordData.word}</span></p>`;
            }
        }

        function updateUserProfile(profile) {
            if (!profile) return;
            if (profile.xp !== undefined) {
                document.getElementById('user-xp').innerText = profile.xp;
            }
            if (profile.title) {
                document.getElementById('user-title').innerText = profile.title;
            }
        }

        async function loadShopItems() {
            try {
                const res = await fetch(`${API_BASE}/shop/items`);
                const data = await res.json();
                
                if (data.user_xp !== undefined) {
                    updateUserProfile({ xp: data.user_xp });
                }

                const grid = document.getElementById('shop-grid');
                grid.innerHTML = '';

                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-900/70 border border-slate-700/80 rounded-xl p-4 flex flex-col justify-between hover:border-rpgaccent/60 transition";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-white text-sm">${item.name}</h4>
                                <span class="text-xs bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded font-semibold">${item.price} XP</span>
                            </div>
                            <p class="text-xs text-slate-400 mb-4">${item.description}</p>
                        </div>
                        <button onclick="playClickSound(); buyItem(${item.id})" class="w-full bg-slate-800 hover:bg-rpgaccent text-slate-200 hover:text-white text-xs font-semibold py-2 rounded-lg transition border border-slate-700">
                            立即购买
                        </button>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("加载商店失败:", err);
            }
        }

        async function buyItem(itemId) {
            try {
                const res = await fetch(`${API_BASE}/shop/buy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ item_id: itemId })
                });
                const result = await res.json();
                if (res.ok) {
                    playSuccessSound();
                    alert(result.message);
                    if (result.user_profile) {
                        updateUserProfile(result.user_profile);
                    } else if (result.remaining_xp !== undefined) {
                        updateUserProfile({ xp: result.remaining_xp });
                    }
                    loadShopItems();
                } else {
                    playFailSound();
                    alert(result.error || "购买失败");
                }
            } catch (err) {
                console.error("购买异常:", err);
            }
        }

        async function openInventory() {
            const modal = document.getElementById('inventory-modal');
            modal.classList.remove('hidden');
            try {
                const res = await fetch(`${API_BASE}/inventory`);
                const data = await res.json();
                const list = document.getElementById('inventory-list');
                list.innerHTML = '';

                if (data.inventory.length === 0) {
                    list.innerHTML = `<p class="text-center text-slate-500 py-6">背包空空如也，快去商店采购吧！</p>`;
                    return;
                }

                data.inventory.forEach(inv => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = "bg-slate-900 border border-slate-700/60 p-3 rounded-xl flex justify-between items-center";
                    itemDiv.innerHTML = `
                        <div>
                            <h5 class="font-bold text-white text-sm">${inv.name} <span class="text-xs text-rpgaccent font-normal">x${inv.quantity}</span></h5>
                            <p class="text-xs text-slate-400 mt-0.5">${inv.description}</p>
                        </div>
                    `;
                    list.appendChild(itemDiv);
                });
            } catch (err) {
                console.error("加载背包失败:", err);
            }
        }

        function closeInventory() {
            playClickSound();
            document.getElementById('inventory-modal').classList.add('hidden');
        }

        window.onload = function() {
            loadShopItems();
            selectDifficulty('easy');
        };
    </script>
</body>
</html>
